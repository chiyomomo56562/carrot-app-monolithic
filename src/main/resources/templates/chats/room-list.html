<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>채팅</title>
</head>

<body>
    <div layout:fragment="content" class="container">
        <div style="max-width: 600px; margin: 40px auto;">
            <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 20px;">채팅</h1>

            <div id="chatRoomList" class="chat-room-list"
                style="background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden;"
                th:if="${chatRooms != null and !chatRooms.isEmpty()}">
                <a th:each="room : ${chatRooms}" th:href="@{/chats/rooms/{roomId}(roomId=${room.roomId})}"
                    class="chat-room-item"
                    style="display: flex; padding: 16px; border-bottom: 1px solid #f1f3f5; text-decoration: none; color: inherit; transition: background 0.2s; align-items: center; gap: 16px;"
                    onmouseover="this.style.background = '#f8f9fa'" onmouseout="this.style.background = 'white'">

                    <th:block th:with="isSeller=${room.sellerId == currentUserId}, 
                                      opponentNickname=${isSeller ? room.buyerNickname : room.sellerNickname}, 
                                      opponentImage=${isSeller ? room.buyerProfileImage : room.sellerProfileImage}">
                        <div style="position: relative;">
                            <div
                                style="width: 48px; height: 48px; border-radius: 50%; background: #eee; overflow: hidden;">
                                <img th:src="${opponentImage != null ? opponentImage : '/images/default-profile.png'}"
                                    style="width: 100%; height: 100%; object-fit: cover;" alt="Profile">
                            </div>
                        </div>

                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                <span style="font-weight: 600; font-size: 0.95rem;">
                                    [[${opponentNickname}]]
                                    <span style="font-weight: 400; color: #868e96; font-size: 0.8rem; margin-left: 4px;"
                                        th:if="${room.lastMessageSentAt != null}">
                                        &bull; <span class="last-message-time"
                                            th:data-time="${room.lastMessageSentAt}"></span>
                                    </span>
                                </span>
                                <span th:if="${room.unreadCount > 0}" th:text="${room.unreadCount}"
                                    style="background: #ff6b00; color: white; border-radius: 50%; padding: 2px 8px; font-size: 0.75rem; font-weight: bold; min-width: 20px; text-align: center; display: inline-block;">
                                </span>
                            </div>
                            <p style="color: var(--text-muted); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0;"
                                th:text="${room.lastMessage != null ? room.lastMessage : '대화가 시작되었습니다.'}">
                            </p>
                        </div>

                        <!-- Product Thumbnail -->
                        <div
                            style="width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex-shrink: 0; border: 1px solid #f1f3f5;">
                            <img th:src="${room.productThumbnail}" style="width: 100%; height: 100%; object-fit: cover;"
                                alt="Product">
                        </div>
                    </th:block>
                </a>
            </div>

            <div id="emptyState"
                th:style="${chatRooms == null or chatRooms.isEmpty() ? 'display: block' : 'display: none'}"
                style="text-align: center; padding: 60px 0;">
                <p style="color: var(--text-muted); margin-bottom: 10px;">대화 중인 채팅방이 없습니다.</p>
                <a th:href="@{/products}" class="btn btn-primary" style="font-size: 0.9rem;">중고거래 시작하기</a>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.last-message-time').forEach(el => {
                    const timeStr = el.getAttribute('data-time');
                    if (timeStr) {
                        el.textContent = formatTime(timeStr);
                    }
                });
            });

            function formatTime(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;

                if (diff < 1000 * 60 * 60 * 24) {
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } else {
                    return date.toLocaleDateString();
                }
            }
        </script>
    </th:block>
</body>

</html>
