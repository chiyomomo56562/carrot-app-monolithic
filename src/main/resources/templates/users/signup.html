<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>회원가입</title>
    <style>
        .profile-upload {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .profile-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            background: #f0f0f0;
        }

        .upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>

<body>
    <div layout:fragment="content" class="auth-wrapper">
        <div class="auth-card animate-fade-in" style="max-width: 500px;">
            <div class="auth-header">
                <h1 class="auth-title">회원가입</h1>
                <p class="auth-subtitle">당근마켓의 가족이 되어주세요!</p>
            </div>

            <form id="signupForm" enctype="multipart/form-data">
                <div class="profile-upload">
                    <img id="previewImg" src="/images/default-profile.png" class="profile-preview"
                        onerror="this.src='https://via.placeholder.com/100'">
                    <label for="profileImage" class="upload-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </label>
                    <input type="file" id="profileImage" name="profileImage" accept="image/*" style="display: none;">
                </div>

                <div class="input-group">
                    <label class="input-label" for="email">이메일</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="email" id="email" name="email" class="form-input" placeholder="example@email.com"
                            required>
                        <button type="button" id="checkEmail" class="btn"
                            style="white-space: nowrap; background: #f0f0f0; padding: 10px 15px;">중복확인</button>
                    </div>
                    <span id="emailError" class="error-msg">이미 가입된 이메일입니다.</span>
                </div>

                <div class="input-group">
                    <label class="input-label" for="nickname">닉네임</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="nickname" name="nickname" class="form-input" placeholder="닉네임을 입력해주세요"
                            required minlength="2" maxlength="20">
                        <button type="button" id="checkNickname" class="btn"
                            style="white-space: nowrap; background: #f0f0f0; padding: 10px 15px;">중복확인</button>
                    </div>
                    <span id="nicknameError" class="error-msg">이미 사용 중인 닉네임입니다.</span>
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="8~20자, 영문/숫자/특수문자 포함" required>
                </div>

                <div class="input-group">
                    <label class="input-label" for="location">우리 동네</label>
                    <input type="text" id="location" name="location" class="form-input" placeholder="예: 서울특별시 서초구"
                        required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">회원가입 완료</button>
            </form>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script>
            let emailChecked = false;
            let nicknameChecked = false;

            // 이미지 미리보기
            document.getElementById('profileImage').addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById('previewImg').src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            });

            // 이메일 중복 확인
            document.getElementById('checkEmail').addEventListener('click', async function () {
                const email = document.getElementById('email').value;
                if (!email) return alert('이메일을 입력해주세요.');

                try {
                    const response = await fetch(`/api/users/email-check?email=${encodeURIComponent(email)}`);
                    const data = await response.json();

                    if (data.isDuplicate) {
                        document.getElementById('emailError').style.display = 'block';
                        emailChecked = false;
                    } else {
                        document.getElementById('emailError').style.display = 'none';
                        alert('사용 가능한 이메일입니다.');
                        emailChecked = true;
                    }
                } catch (e) {
                    console.error(e);
                }
            });

            // 닉네임 중복 확인
            document.getElementById('checkNickname').addEventListener('click', async function () {
                const nickname = document.getElementById('nickname').value;
                if (!nickname) return alert('닉네임을 입력해주세요.');

                try {
                    const response = await fetch(`/api/users/nickname-check?nickname=${encodeURIComponent(nickname)}`);
                    const data = await response.json();

                    if (data.isDuplicate) {
                        document.getElementById('nicknameError').style.display = 'block';
                        nicknameChecked = false;
                    } else {
                        document.getElementById('nicknameError').style.display = 'none';
                        alert('사용 가능한 닉네임입니다.');
                        nicknameChecked = true;
                    }
                } catch (e) {
                    console.error(e);
                }
            });

            // 회원가입 폼 제출
            document.getElementById('signupForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                if (!emailChecked || !nicknameChecked) {
                    return alert('이메일과 닉네임 중복확인을 완료해주세요.');
                }

                const formData = new FormData(this);
                const signupRequest = {
                    email: formData.get('email'),
                    password: formData.get('password'),
                    nickname: formData.get('nickname'),
                    location: formData.get('location')
                };

                // JSON과 파일을 함께 보내기 위한 Blob 처리
                const blob = new Blob([JSON.stringify(signupRequest)], { type: 'application/json' });
                const finalData = new FormData();
                finalData.append('request', blob);
                if (formData.get('profileImage').size > 0) {
                    finalData.append('profileImage', formData.get('profileImage'));
                }

                try {
                    const response = await fetch('/api/users/signup', {
                        method: 'POST',
                        body: finalData
                    });

                    if (response.ok) {
                        alert('회원가입이 완료되었습니다! 이메일 인증을 해주세요.');
                        window.location.href = '/users/login';
                    } else {
                        const err = await response.json();
                        alert(err.message || '회원가입에 실패했습니다.');
                    }
                } catch (e) {
                    console.error(e);
                    alert('서버 통신 중 오류가 발생했습니다.');
                }
            });
        </script>
    </th:block>
</body>

</html>
