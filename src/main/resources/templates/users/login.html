<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>로그인</title>
</head>

<body>
    <div layout:fragment="content" class="auth-wrapper">
        <div class="auth-card animate-fade-in">
            <div class="auth-header">
                <h1 class="auth-title">반가워요!</h1>
                <p class="auth-subtitle">로그인하고 당근마켓을 시작해보세요.</p>
            </div>

            <form th:action="@{/api/auth/login}" method="post">
                <div class="input-group">
                    <label class="input-label" for="username">이메일</label>
                    <input type="email" id="username" name="username" class="form-input" placeholder="example@email.com"
                        required>
                </div>
                <div class="input-group">
                    <label class="input-label" for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력해주세요"
                        required>
                </div>

                <div th:if="${param.error}"
                    style="color: var(--error-color); margin-bottom: 20px; font-size: 0.875rem; text-align: center;">
                    이메일 또는 비밀번호를 확인해주세요.
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">로그인</button>
            </form>

            <div style="margin-top: 30px; text-align: center; border-top: 1px solid #eee; padding-top: 20px;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    아직 회원이 아니신가요?
                    <a th:href="@{/users/signup}"
                        style="color: var(--primary-color); font-weight: 600; text-decoration: none; margin-left: 5px;">회원가입</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
