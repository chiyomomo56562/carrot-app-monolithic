<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>내 물건 팔기</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body>
    <div layout:fragment="content" class="container">
        <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
            <div class="auth-card" style="max-width: 600px;">
                <div class="auth-header" style="text-align: left;">
                    <h1 class="auth-title">중고거래 글쓰기</h1>
                </div>

                <form id="productForm" enctype="multipart/form-data">
                    <div class="input-group">
                        <label class="input-label">상품 이미지</label>
                        <input type="file" name="images" class="form-input" multiple accept="image/*">
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">최대 10개까지 업로드 가능합니다.</p>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="title">제목</label>
                        <input type="text" id="title" name="title" class="form-input" placeholder="제목" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="categoryId">카테고리</label>
                        <select id="categoryId" name="categoryId" class="form-input" required>
                            <option value="">카테고리 선택</option>
                            <th:block th:each="cat : ${categories}">
                                <option th:value="${cat.id}" th:text="${cat.name}"></option>
                                <th:block th:each="child : ${cat.children}">
                                    <option th:value="${child.id}" th:text="' - ' + ${child.name}"></option>
                                </th:block>
                            </th:block>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="price">가격 (원)</label>
                        <input type="number" id="price" name="price" class="form-input" placeholder="가격 (₩)" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="description">설명</label>
                        <textarea id="description" name="description" class="form-input" rows="8"
                            placeholder="구매 시기, 브랜드, 사용감, 하자 여부 등" required></textarea>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="location">거래 희망 장소</label>
                        <input type="text" id="location" name="location" class="form-input" placeholder="장소" required>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 30px;">
                        <button type="button" class="btn" style="background: #f1f3f5; flex: 1;"
                            onclick="history.back()">취소</button>
                        <button type="submit" class="btn btn-primary" style="flex: 2;">완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            document.getElementById('productForm').addEventListener('submit', function (e) {
                e.preventDefault();

                function getCookie(name) {
                    const value = `; ${document.cookie}`;
                    const parts = value.split(`; ${name}=`);
                    if (parts.length === 2) return parts.pop().split(';').shift();
                }

                const formData = new FormData(this);
                // 쿠키에서 먼저 토큰을 찾고, 없으면 메타 태그에서 가져옴 (Spring Security 6 호환성)
                const csrfToken = getCookie('XSRF-TOKEN') || document.querySelector('meta[name="_csrf"]').content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

                console.log('### Sending CSRF Token:', csrfToken);
                console.log('### Sending CSRF Header:', csrfHeader);

                fetch('/api/products/new', {
                    method: 'POST',
                    headers: {
                        [csrfHeader]: csrfToken
                    },
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        }
                        throw new Error('상품 등록에 실패했습니다.');
                    })
                    .then(data => {
                        window.location.href = '/products/' + data.id;
                    })
                    .catch(error => {
                        alert(error.message);
                    });
            });
        </script>
    </th:block>
</body>

</html>
