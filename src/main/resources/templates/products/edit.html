<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<head>
    <title>상품 수정</title>
    <style>
        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            min-height: 100px;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 8px;
        }

        .image-preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border: 1px solid #eee;
            border-radius: 4px;
            cursor: move;
            background: #fff;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .image-preview-item .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .image-preview-item.dragging {
            opacity: 0.5;
            border: 2px solid var(--primary-color);
        }

        .image-preview-item.over {
            border-left: 4px solid var(--primary-color);
        }

        .thumbnail-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(var(--primary-rgb), 0.8);
            color: white;
            font-size: 10px;
            text-align: center;
            padding: 2px 0;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }
    </style>
</head>

<body>
    <div layout:fragment="content" class="container">
        <div class="auth-wrapper" style="align-items: flex-start; padding-top: 40px;">
            <div class="auth-card" style="max-width: 800px;">
                <div class="auth-header" style="text-align: left;">
                    <h1 class="auth-title">중고거래 글 수정하기</h1>
                </div>

                <form id="productEditForm" enctype="multipart/form-data">
                    <div class="input-group">
                        <label class="input-label">상품 이미지 (드래그하여 순서 변경 가능)</label>
                        <div id="imagePreviewContainer" class="image-preview-container">
                            <!-- 기존 이미지 목록 -->
                            <div th:each="img, status : ${product.images}" class="image-preview-item" draggable="true"
                                th:data-id="${img.id}">
                                <img th:src="${img.imageUrl}" alt="이미지">
                                <button type="button" class="remove-btn" onclick="removeImage(this)">×</button>
                                <div th:if="${status.index == 0}" class="thumbnail-badge">대표 이미지</div>
                            </div>
                        </div>
                        <input type="file" id="imageInput" class="form-input" multiple accept="image/*"
                            style="margin-top: 10px;" onchange="handleImageSelection(this)">
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">최대 5개까지 업로드 가능합니다.</p>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="title">제목</label>
                        <input type="text" id="title" name="title" class="form-input" th:value="${product.title}"
                            required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="categoryId">카테고리</label>
                        <select id="categoryId" name="categoryId" class="form-input" required>
                            <option value="">카테고리 선택</option>
                            <th:block th:each="cat : ${categories}">
                                <option th:value="${cat.id}" th:text="${cat.name}"
                                    th:selected="${cat.id == product.categoryId}"></option>
                                <th:block th:each="child : ${cat.children}">
                                    <option th:value="${child.id}" th:text="' - ' + ${child.name}"
                                        th:selected="${child.id == product.categoryId}"></option>
                                </th:block>
                            </th:block>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="status">판매 상태</label>
                        <select id="status" name="status" class="form-input" required>
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"
                                th:selected="${status.name() == product.status}"></option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="price">가격 (원)</label>
                        <input type="number" id="price" name="price" class="form-input" th:value="${product.price}"
                            required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="description">설명</label>
                        <textarea id="description" name="description" class="form-input" rows="8" required
                            th:text="${product.description}"></textarea>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="location">거래 희망 장소</label>
                        <input type="text" id="location" name="location" class="form-input"
                            th:value="${product.location}" required>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 30px;">
                        <button type="button" class="btn" style="background: #f1f3f5; flex: 1;"
                            onclick="history.back()">취소</button>
                        <button type="submit" class="btn btn-primary" style="flex: 2;">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            const container = document.getElementById('imagePreviewContainer');
            let newImagesMap = new Map(); // id(unique timestamp) -> File Object
            let dragSrcEl = null;

            // 드래그 앤 드롭 이벤트 설정
            initDragAndDrop();

            function initDragAndDrop() {
                const items = container.querySelectorAll('.image-preview-item');
                items.forEach(item => {
                    item.addEventListener('dragstart', handleDragStart);
                    item.addEventListener('dragover', handleDragOver);
                    item.addEventListener('dragenter', handleDragEnter);
                    item.addEventListener('dragleave', handleDragLeave);
                    item.addEventListener('drop', handleDrop);
                    item.addEventListener('dragend', handleDragEnd);
                });
            }

            function handleDragStart(e) {
                this.classList.add('dragging');
                dragSrcEl = this;
                e.dataTransfer.effectAllowed = 'move';
            }

            function handleDragOver(e) {
                if (e.preventDefault) e.preventDefault();
                return false;
            }

            function handleDragEnter(e) {
                if (this !== dragSrcEl) this.classList.add('over');
            }

            function handleDragLeave(e) {
                this.classList.remove('over');
            }

            function handleDrop(e) {
                if (e.stopPropagation) e.stopPropagation();

                if (dragSrcEl !== this) {
                    // 순서 변경 로직: 드래그 요소의 위치를 드랍 요소 앞으로 이동
                    const rect = this.getBoundingClientRect();
                    const next = (e.clientX - rect.left) > (rect.width / 2);

                    if (next) container.insertBefore(dragSrcEl, this.nextSibling);
                    else container.insertBefore(dragSrcEl, this);

                    updateThumbnailBadge();
                }
                return false;
            }

            function handleDragEnd(e) {
                this.classList.remove('dragging');
                container.querySelectorAll('.image-preview-item').forEach(item => item.classList.remove('over'));
            }

            function updateThumbnailBadge() {
                container.querySelectorAll('.thumbnail-badge').forEach(b => b.remove());
                const firstItem = container.querySelector('.image-preview-item');
                if (firstItem) {
                    const badge = document.createElement('div');
                    badge.className = 'thumbnail-badge';
                    badge.innerText = '대표 이미지';
                    firstItem.appendChild(badge);
                }
            }

            function handleImageSelection(input) {
                if (container.children.length + input.files.length > 5) {
                    alert('이미지는 최대 5개까지 등록 가능합니다.');
                    input.value = '';
                    return;
                }

                Array.from(input.files).forEach(file => {
                    const id = 'new-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                    newImagesMap.set(id, file);

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const div = document.createElement('div');
                        div.className = 'image-preview-item';
                        div.setAttribute('draggable', 'true');
                        div.setAttribute('data-new-id', id);
                        div.innerHTML = `
                            <img src="${e.target.result}" alt="미리보기">
                            <button type="button" class="remove-btn" onclick="removeImage(this)">×</button>
                        `;
                        // 새 아이템 이벤트 리스너 추가
                        div.addEventListener('dragstart', handleDragStart);
                        div.addEventListener('dragover', handleDragOver);
                        div.addEventListener('dragenter', handleDragEnter);
                        div.addEventListener('dragleave', handleDragLeave);
                        div.addEventListener('drop', handleDrop);
                        div.addEventListener('dragend', handleDragEnd);

                        container.appendChild(div);
                        updateThumbnailBadge();
                    }
                    reader.readAsDataURL(file);
                });
                input.value = ''; // 같은 파일 재선택 가능하도록 초기화
            }

            function removeImage(btn) {
                const item = btn.closest('.image-preview-item');
                const newId = item.getAttribute('data-new-id');
                if (newId) {
                    newImagesMap.delete(newId);
                }
                item.remove();
                updateThumbnailBadge();
            }

            document.getElementById('productEditForm').addEventListener('submit', function (e) {
                e.preventDefault();

                const productId = /*[[${product.id}]]*/ '';
                const csrfToken = document.cookie.split('; ')
                    .find(row => row.startsWith('XSRF-TOKEN='))
                    ?.split('=')[1];

                const formData = new FormData(this);

                // imageOrder 구성 및 newImages 추출
                const items = container.querySelectorAll('.image-preview-item');
                items.forEach(item => {
                    const existingId = item.getAttribute('data-id');
                    const newId = item.getAttribute('data-new-id');

                    if (existingId) {
                        formData.append('imageOrder', existingId);
                    } else if (newId) {
                        formData.append('imageOrder', -1);
                        formData.append('newImages', newImagesMap.get(newId));
                    }
                });

                fetch('/api/products/' + productId + '/edit', {
                    method: 'PATCH',
                    headers: {
                        'X-XSRF-TOKEN': csrfToken
                    },
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.href = '/products/' + productId;
                        } else {
                            return response.json().then(err => {
                                throw new Error(err.message || '상품 수정에 실패했습니다.');
                            });
                        }
                    })
                    .catch(error => {
                        alert(error.message);
                    });
            });
        </script>
    </th:block>
</body>

</html>
