<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | 당근마켓">당근마켓</title>

    <meta name="user-id" th:if="${#authorization.expression('isAuthenticated()')}"
        th:content="${#authentication.principal.id}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <th:block layout:fragment="css"></th:block>
</head>

<body>
    <header>
        <div class="container header-content">
            <a th:href="@{/}" class="logo">당근마켓</a>

            <form action="/search" method="get" style="flex: 1; max-width: 400px; margin: 0 40px;">
                <input type="text" name="q" placeholder="물품이나 동네를 검색해보세요" class="form-input" th:value="${param.q}"
                    style="background-color: #f1f3f5; border: none;">
            </form>

            <nav class="nav-links">
                <a th:href="@{/products}" class="nav-link">중고거래</a>
                <a th:href="@{/chats/rooms}" class="nav-link">채팅</a>

                <th:block th:if="${#authorization.expression('isAnonymous()')}">
                    <a th:href="@{/users/login}" class="nav-link">로그인</a>
                    <a th:href="@{/users/signup}" class="nav-link btn btn-primary" style="padding: 8px 16px;">회원가입</a>
                </th:block>

                <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/users/me}" class="nav-link">내 프로필</a>
                    <form th:action="@{/api/auth/logout}" method="post" style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="nav-link"
                            style="background: none; border: none; font-size: 1rem; cursor: pointer;">로그아웃</button>
                    </form>
                </th:block>
            </nav>
        </div>
    </header>

    <main layout:fragment="content">
        <!-- Content will be injected here -->
    </main>

    <th:block layout:fragment="script"></th:block>
</body>

</html>
